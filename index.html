.pgdb{height:5px;background:var(--bg3);border-radius:3px;margin-top:8px;overflow:hidden}

.es{text-align:center;padding:44px 20px;color:var(--text3);font-size:13px;background:var(--bg2);border-radius:var(--radius-lg);border:1px dashed var(--border)}

/* Responsive */

  .kg{grid-template-columns:repeat(3,1fr)}
  .pnm{max-width:280px}
  .ct{padding:20px 20px}
  .hd-in{padding:12px 20px}
  .tbs{padding:0 20px}
  .pr{gap:10px}

@media(max-width:640px){

  .ct{padding:18px 14px}

  .pnm{max-width:200px;font-size:12.5px}
  .ppct{font-size:22px}
  .pr{flex-direction:column;align-items:flex-end;gap:4px}
}

/* ═══════════════ HELPERS ═══════════════ */

const fmPct = n => Math.round(n * 100) + '%';
const fmCop = n => n ? '$' + Math.round(n).toLocaleString('es-CO') : '—';
const fmCopShort = n => {
  if (!n) return '—';
  if (n >= 1e9) return '$' + (n/1e9).toFixed(1) + 'B';
  if (n >= 1e6) return '$' + (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return '$' + (n/1e3).toFixed(0) + 'K';
  return '$' + n;
};
const pColor = v => v >= 0.7 ? 'var(--green)' : v >= 0.4 ? 'var(--amber)' : 'var(--red)';
/* Si el gestor escribió ESTADO en el Sheet, lo respetamos.
   Si está vacío, lo derivamos automáticamente de Ci/Ti. */
const deriveStatus = (cs, ts, manual) => {
  if (manual) {
    const m = String(manual).trim().toLowerCase();
    if (m.startsWith('compl')) return 'Completada';
    if (m.startsWith('en pro') || m.startsWith('progr')) return 'En progreso';
    if (m.startsWith('no')) return 'No iniciada';
  }
  if (!ts || ts <= 0) return 'No iniciada';
  if (cs >= ts) return 'Completada';
  if (cs <= 0) return 'No iniciada';
  return 'En progreso';
};
const normWeight = w => {
  const v = +w || 0;
  return v > 1 ? v / 100 : v;
};

/* parsea respuesta de Sheets API: data.values es [[headers], [row1], ...] */
function rowsFromSheet(values) {
  if (!values || !values.length) return [];
  const [headers, ...rows] = values;
  return rows.map(r => Object.fromEntries(headers.map((h, i) => [h, r[i]])));
}

function App() {
  const [proj, setProj]   = useState([]);
  const [acts, setActs]   = useState([]);
  const [tab, setTab]     = useState('General');
  const [fEje, setFEje]   = useState('Todos');
  const [fEst, setFEst]   = useState('Todos');
  const [fPGD, setFPGD]   = useState('Todos');
  const [fResp, setFResp] = useState('Todos');
  const [search, setSearch] = useState('');
  const [exp, setExp]     = useState({});
  const [src, setSrc]     = useState(null);
  const [load, setLoad]   = useState(true);
  const [upd, setUpd]     = useState(null);
  const [refr, setRefr]   = useState(false);
  const [err, setErr]     = useState('');

  /* ─── Carga desde Google Sheets API v4 ─── */
  function doFetch(isR) {
    if (isR) setRefr(true); else setLoad(true);
    setErr('');
    const u = (tab) => `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(tab)}?key=${API_KEY}`;
    Promise.all([
      fetch(u(TAB_PROY)).then(r => r.json()),
      fetch(u(TAB_ACT)).then(r => r.json())
    ]).then(([rp, ra]) => {
      if (rp.error || ra.error) {
        const m = (rp.error || ra.error).message || 'Error desconocido';
        throw new Error(m);
      }
      const pd = rowsFromSheet(rp.values);
      const ad = rowsFromSheet(ra.values);
      setProj(pd.map(r => ({
        id: +(r.ID_PROYECTO || 0),
        eje: +(r.EJE_PLAN_ACCION || 0),
        nombre: r.NOMBRE_PROYECTO || '',
        dep: r.DEPENDENCIA_ENCARGADA || '',
        resp: r.PERSONA_RESPONSABLE || r.RESPONSABLE || '—',
        pgd: r.EJE_PGD || '',
        pres: +(r.PRESUPUESTO_INICIAL || 0),
        ejec: +(r.EJECUCION_PRESUPUESTO || 0),
        est: r.ESTADO_PROYECTO || 'Activo',
        gestor: r.GESTOR_ENCARGADO || '',
        obs: r.OBSERVACIONES_GENERALES || r.OBSERVACIONES || ''
      })).filter(r => r.id));
      setActs(ad.map(r => ({
        idP: +(r.ID_PROYECTO || 0),
        idA: r.ID_ACTIVIDAD || '',
        nom: r.NOMBRE_ACTIVIDAD || '',
        w: normWeight(r.PESO_Wi),
        ts: +(r.TOTAL_SUBACTIVIDADES || 0),
        cs: +(r.SUBACT_COMPLETADAS || 0),
        est: r.ESTADO || '',
        ds: r.DESCRIPCION_AVANCE || '',
        fecha: r.FECHA_ACTUALIZACION || '',
        resp: r.RESPONSABLE || '',
        obs: r.OBSERVACIONES || ''
      })).filter(r => r.idP));
      setSrc('sheets'); setUpd(new Date()); setLoad(false); setRefr(false);
    }).catch(e => {
      console.warn('Sheets error:', e.message);
      setErr(e.message); setLoad(false); setRefr(false);
      if (!isR) doDemo();
    });
  }

  function doDemo() { setProj(DEMO_P); setActs(DEMO_A); setSrc('demo'); setLoad(false); }

  useEffect(() => {
    if (SHEET_ID && API_KEY) doFetch(false); else doDemo();
  }, []);

  /* ─── Carga desde Excel local (modo admin) ─── */
  function doFile(e) {
    const f = e.target.files[0]; if (!f) return; setLoad(true);
    const rd = new FileReader();
    rd.onload = ev => {
      try {
        const wb = XLSX.read(ev.target.result, { type: 'binary' });
        const sP = wb.Sheets[TAB_PROY] || wb.Sheets[wb.SheetNames[0]];
        const sA = wb.Sheets[TAB_ACT]  || wb.Sheets[wb.SheetNames[1]];
        const s1 = XLSX.utils.sheet_to_json(sP);
        const s2 = XLSX.utils.sheet_to_json(sA);
        setProj(s1.map(r => ({
          id: +(r.ID_PROYECTO || 0), eje: +(r.EJE_PLAN_ACCION || 0),
          nombre: r.NOMBRE_PROYECTO || '', dep: r.DEPENDENCIA_ENCARGADA || '',
          resp: r.PERSONA_RESPONSABLE || r.RESPONSABLE || '—', pgd: r.EJE_PGD || '',
          pres: +(r.PRESUPUESTO_INICIAL || 0), ejec: +(r.EJECUCION_PRESUPUESTO || 0),
          est: r.ESTADO_PROYECTO || 'Activo', gestor: r.GESTOR_ENCARGADO || '', obs: r.OBSERVACIONES_GENERALES || r.OBSERVACIONES || ''
        })).filter(r => r.id));
        setActs(s2.map(r => ({
          idP: +(r.ID_PROYECTO || 0), idA: r.ID_ACTIVIDAD || '',
          nom: r.NOMBRE_ACTIVIDAD || '', w: normWeight(r.PESO_Wi),
          ts: +(r.TOTAL_SUBACTIVIDADES || 0), cs: +(r.SUBACT_COMPLETADAS || 0),
          est: r.ESTADO || '', ds: r.DESCRIPCION_AVANCE || '', fecha: r.FECHA_ACTUALIZACION || '',
          resp: r.RESPONSABLE || '', obs: r.OBSERVACIONES || ''
        })).filter(r => r.idP));
        setSrc('file'); setUpd(new Date()); setErr('');
      } catch (er) { alert('Error leyendo Excel: ' + er.message); }
      setLoad(false);
      e.target.value = '';
    };
    rd.readAsBinaryString(f);
  }

  /* ─── Listas derivadas ─── */
  const deps = useMemo(() => [...new Set(proj.map(p => p.dep))].filter(Boolean).sort(), [proj]);
  const responsables = useMemo(() => [...new Set(proj.map(p => p.resp))].filter(r => r && r !== '—').sort(), [proj]);
  const pgds = useMemo(() => [...new Set(proj.map(p => p.pgd))].filter(Boolean).sort(), [proj]);

  const tabList = ['General', ...deps.map(d => DSH[d] || d.substring(0, 8))];
  const aDep = tab === 'General' ? null : deps.find(d => (DSH[d] || d.substring(0, 8)) === tab);

  /* ─── Cálculos ─── */
  function getAv(pid) {
    const a = acts.filter(x => x.idP === pid);
    if (!a.length) return 0;
    const totalW = a.reduce((s, x) => s + x.w, 0);
    if (totalW <= 0) return 0;
    // si los pesos no suman 1.0, normalizamos
    const norm = totalW > 0 ? a.reduce((s, x) => s + (x.w / totalW) * (Math.min(x.cs, x.ts) / Math.max(x.ts, 1)), 0) : 0;
    return Math.min(1, Math.max(0, norm));
  }
  function getCn(pid) {
    const a = acts.filter(x => x.idP === pid);
    return {
      t: a.length,
      d: a.filter(x => deriveStatus(x.cs, x.ts, x.est) === 'Completada').length,
      p: a.filter(x => deriveStatus(x.cs, x.ts, x.est) === 'En progreso').length,
      n: a.filter(x => deriveStatus(x.cs, x.ts, x.est) === 'No iniciada').length
    };
  }
  function getWeightWarn(pid) {
    const a = acts.filter(x => x.idP === pid);
    if (!a.length) return null;
    const sum = a.reduce((s, x) => s + x.w, 0);
    if (Math.abs(sum - 1) > 0.02) return sum;
    return null;
  }

  /* ─── Filtros aplicados ─── */
  const filt = useMemo(() => {
    let f = aDep ? proj.filter(p => p.dep === aDep) : proj;
    if (fEje !== 'Todos')  f = f.filter(p => p.eje === +fEje);
    if (fEst !== 'Todos')  f = f.filter(p => p.est === fEst);
    if (fPGD !== 'Todos')  f = f.filter(p => p.pgd === fPGD);
    if (fResp !== 'Todos') f = f.filter(p => p.resp === fResp);
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      f = f.filter(p => p.nombre.toLowerCase().includes(q) || ('p' + p.id).includes(q) || String(p.id).includes(q) || (p.resp || '').toLowerCase().includes(q));
    }
    return f;
  }, [proj, aDep, fEje, fEst, fPGD, fResp, search]);

  function clearFilters() {
    setFEje('Todos'); setFEst('Todos'); setFPGD('Todos'); setFResp('Todos'); setSearch('');
  }
  const hasFilters = fEje !== 'Todos' || fEst !== 'Todos' || fPGD !== 'Todos' || fResp !== 'Todos' || search.trim();

  /* ─── Estadísticas globales ─── */
  const gS = useMemo(() => {
    const pids = new Set(filt.map(p => p.id));
    const a = acts.filter(x => pids.has(x.idP));
    const stats = a.map(x => deriveStatus(x.cs, x.ts, x.est));
    return {
      t: a.length,
      d: stats.filter(s => s === 'Completada').length,
      p: stats.filter(s => s === 'En progreso').length,
      n: stats.filter(s => s === 'No iniciada').length,
      av: filt.length ? filt.reduce((s, p) => s + getAv(p.id), 0) / filt.length : 0,
      pres: filt.reduce((s, p) => s + p.pres, 0),
      ejec: filt.reduce((s, p) => s + p.ejec, 0)
    };
  }, [filt, acts]);

  /* ─── Por eje ─── */
  const eStats = useMemo(() => [1, 2, 3, 4, 5].map(e => {
    const ep = filt.filter(p => p.eje === e);
    const pids = new Set(ep.map(p => p.id));
    const ea = acts.filter(a => pids.has(a.idP));
    const sts = ea.map(x => deriveStatus(x.cs, x.ts, x.est));
    return {
      eje: e,
      t: ea.length,
      d: sts.filter(s => s === 'Completada').length,
      p: sts.filter(s => s === 'En progreso').length,
      n: sts.filter(s => s === 'No iniciada').length,
      av: ep.length ? ep.reduce((s, p) => s + getAv(p.id), 0) / ep.length : 0,
      pc: ep.length
    };
  }).filter(e => e.pc > 0), [filt, acts]);

  /* ─── Por dependencia ─── */
  const dStats = useMemo(() => deps.map(d => {
    const dp = filt.filter(p => p.dep === d); if (!dp.length) return null;
    const pids = new Set(dp.map(p => p.id));
    const da = acts.filter(a => pids.has(a.idP));
    const sts = da.map(x => deriveStatus(x.cs, x.ts, x.est));
    return {
      dep: d, sh: DSH[d] || d.substring(0, 8),
      t: da.length,
      d: sts.filter(s => s === 'Completada').length,
      p: sts.filter(s => s === 'En progreso').length,
      n: sts.filter(s => s === 'No iniciada').length,
      av: dp.reduce((s, p) => s + getAv(p.id), 0) / dp.length,
      pc: dp.length
    };
  }).filter(Boolean).sort((a, b) => b.av - a.av), [filt, acts, deps]);

  /* ─── Por eje PGD ─── */
  const pgdStats = useMemo(() => {
    const map = {};
    filt.forEach(p => {
      if (!p.pgd) return;
      if (!map[p.pgd]) map[p.pgd] = { code: p.pgd, projects: [], avSum: 0 };
      map[p.pgd].projects.push(p);
      map[p.pgd].avSum += getAv(p.id);
    });
    return Object.values(map).map(x => ({
      code: x.code,
      pc: x.projects.length,
      av: x.avSum / x.projects.length
    })).sort((a, b) => a.code.localeCompare(b.code));
  }, [filt, acts]);

  /* ─── Header ─── */
  const Header = (
    <div className="hd">
      <div className="hd-in">
        <div className="hd-brand">
          <div className="hd-logo">FM</div>
          <div className="hd-t">
            <h1>Seguimiento <em>Plan de Acción</em> 2024–2026</h1>
            <p>Facultad de Minas · Universidad Nacional de Colombia, Sede Medellín</p>
          </div>
        </div>
        <div className="hd-r">
          <div className="hd-acts">
            {SHEET_ID && API_KEY && (
              <button className="btn btn-ref" onClick={() => doFetch(true)} disabled={refr}>
                <span className={refr ? 'sp' : ''}>↻</span>
                {refr ? ' Actualizando...' : ' Actualizar datos'}
              </button>
            )}
            {isAdmin && <label className="btn btn-upl" htmlFor="fup">Cargar Excel</label>}
            {isAdmin && <input id="fup" type="file" accept=".xlsx,.xls" onChange={doFile} style={{ display: 'none' }} />}
            {isAdmin && <span className="b-admin">Admin</span>}
          </div>
          {upd && <div className="lu">Actualizado: {upd.toLocaleString('es-CO', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</div>}
        </div>
      </div>
    </div>
  );

  if (load) return (
    <div>{Header}<div className="lds"><div className="ldsp"></div><div className="ldt">Cargando datos del plan de acción...</div></div></div>
  );

  /* ─── Status banner ─── */
  const statusBanner = (
    <div className={'sb' + (src === 'demo' && err ? ' sb-warn' : '')}>
      <span className={'sd ' + (src === 'sheets' ? 'sd-l' : src === 'file' ? 'sd-f' : err ? 'sd-e' : 'sd-d')}></span>
      {src === 'sheets' && <span>Conectado a Google Sheets · presiona <b>Actualizar datos</b> para sincronizar</span>}
      {src === 'file' && <span>Datos cargados desde archivo Excel local</span>}
      {src === 'demo' && !err && <span>Datos de demostración · configura el Google Sheet para ver datos reales</span>}
      {src === 'demo' && err && <span><b>No se pudo conectar al Sheet:</b> {err.substring(0, 140)} · mostrando datos de demostración</span>}
    </div>
  );

  return (
    <div>
      {Header}
      <div className="tw">
        <div className="tbs">
          {tabList.map(t => {
            const cn = t === 'General' ? proj.length : (proj.filter(p => (DSH[p.dep] || p.dep.substring(0, 8)) === t).length);
            return (
              <button key={t} className={'tb' + (tab === t ? ' on' : '')} onClick={() => { setTab(t); setExp({}); }}>
                {t}<span className="tb-cnt">{cn}</span>
              </button>
            );
          })}
        </div>
      </div>

      <div className="ct">
        {statusBanner}

        {/* KPIs */}
        <div className="kg">
          <div className="kp">
            <div className="kl">Avance ponderado</div>
            <div className="kv" style={{ color: pColor(gS.av) }}>{fmPct(gS.av)}</div>
            <div className="ka" style={{ background: pColor(gS.av) }}></div>
            <div className="ks">{filt.length} {filt.length === 1 ? 'proyecto' : 'proyectos'}</div>
          </div>
          <div className="kp">
            <div className="kl">Total actividades</div>
            <div className="kv">{gS.t}</div>
            <div className="ka" style={{ background: 'var(--text3)' }}></div>
            <div className="ks">en {filt.length} proyectos</div>
          </div>
          <div className="kp">
            <div className="kl">Completadas</div>
            <div className="kv" style={{ color: 'var(--green)' }}>{gS.d}</div>
            <div className="ka" style={{ background: 'var(--green)' }}></div>
            <div className="ks">{gS.t ? Math.round(gS.d / gS.t * 100) + '% del total' : ''}</div>
          </div>
          <div className="kp">
            <div className="kl">En progreso</div>
            <div className="kv" style={{ color: 'var(--amber)' }}>{gS.p}</div>
            <div className="ka" style={{ background: 'var(--amber)' }}></div>
            <div className="ks">{gS.t ? Math.round(gS.p / gS.t * 100) + '% del total' : ''}</div>
          </div>
          <div className="kp">
            <div className="kl">No iniciadas</div>
            <div className="kv" style={{ color: 'var(--red)' }}>{gS.n}</div>
            <div className="ka" style={{ background: 'var(--red)' }}></div>
            <div className="ks">{gS.t ? Math.round(gS.n / gS.t * 100) + '% del total' : ''}</div>
          </div>
        </div>

        {/* Filtros */}
        <div className="fr">
          <span className="fl">Filtrar</span>
          <input className="fi" type="search" placeholder="Buscar proyecto, ID o responsable..." value={search} onChange={e => setSearch(e.target.value)} />
          <select className="fs" value={fEje} onChange={e => setFEje(e.target.value)}>
            <option value="Todos">Todos los ejes</option>
            {[1,2,3,4,5].map(e => <option key={e} value={e}>Eje {e}</option>)}
          </select>
          <select className="fs" value={fEst} onChange={e => setFEst(e.target.value)}>
            <option value="Todos">Todos los estados</option>
            {['Activo','Cerrado','Cancelado'].map(s => <option key={s} value={s}>{s}</option>)}
          </select>
          <select className="fs" value={fPGD} onChange={e => setFPGD(e.target.value)}>
            <option value="Todos">Todos los ejes PGD</option>
            {pgds.map(e => <option key={e} value={e}>{e}</option>)}
          </select>
          {responsables.length > 0 && (
            <select className="fs" value={fResp} onChange={e => setFResp(e.target.value)}>
              <option value="Todos">Todos los responsables</option>
              {responsables.map(r => <option key={r} value={r}>{r}</option>)}
            </select>
          )}
          {hasFilters && <button className="fbtn" onClick={clearFilters}>✕ Limpiar</button>}
          <span className="fc">{filt.length} de {aDep ? proj.filter(p => p.dep === aDep).length : proj.length}</span>
        </div>

        {/* Leyenda */}
        <div className="lg">
          <span className="li"><span className="ld" style={{ background: 'var(--green)' }}></span>Completada</span>
          <span className="li"><span className="ld" style={{ background: 'var(--amber)' }}></span>En progreso</span>
          <span className="li"><span className="ld" style={{ background: 'var(--red)' }}></span>No iniciada</span>
          <span className="li"><span className="ld" style={{ background: 'var(--purple)' }}></span>Proyecto cerrado</span>
        </div>

        {/* ════════════════ VISTA GENERAL ════════════════ */}
        {tab === 'General' && (
          <div>
            {eStats.length === 0 && <div className="es">No hay proyectos con los filtros seleccionados.</div>}

            {eStats.length > 0 && (
              <>
                <div className="st">Avance ponderado por eje del Plan de Acción</div>
                {eStats.map((e, i) => (
                  <div key={e.eje} className="ec" style={{ animationDelay: i * 0.06 + 's' }}>
                    <div className="eh">
                      <div className="ei">
                        <div className="en">Eje {e.eje} · {e.pc} {e.pc === 1 ? 'proyecto' : 'proyectos'}</div>
                        <div className="em">{EJES[e.eje]}</div>
                      </div>
                      <div className="ep" style={{ color: pColor(e.av) }}>{fmPct(e.av)}</div>
                    </div>
                    <div className="bt">
                      <div className="bd" style={{ width: (e.t ? e.d / e.t * 100 : 0) + '%' }}></div>
                      <div className="bp" style={{ width: (e.t ? e.p / e.t * 100 : 0) + '%' }}></div>
                      <div className="bn" style={{ width: (e.t ? e.n / e.t * 100 : 0) + '%' }}></div>
                    </div>
                    <div className="bm">
                      <div className="bml">
                        <span>{e.d} completadas</span>
                        <span>{e.p} en progreso</span>
                        <span>{e.n} no iniciadas</span>
                      </div>
                      <span>{e.t} actividades</span>
                    </div>
                  </div>
                ))}
              </>
            )}

            {dStats.length > 0 && (
              <div style={{ marginTop: 28 }}>
                <div className="st">Avance por dependencia <span className="st-sub">click una fila para ver el detalle</span></div>
                <div className="dtw">
                  <table className="dt">
                    <thead>
                      <tr>
                        <th>Dependencia</th><th>Proy.</th><th>Act.</th>
                        <th>Compl.</th><th>Progr.</th><th>No ini.</th>
                        <th>Avance ponderado</th>
                      </tr>
                    </thead>
                    <tbody>
                      {dStats.map(d => (
                        <tr key={d.dep} onClick={() => setTab(d.sh)}>
                          <td><span className="dn">{d.sh}</span> <span style={{color:'var(--text3)',fontSize:11}}>· {d.dep}</span></td>
                          <td>{d.pc}</td>
                          <td>{d.t}</td>
                          <td style={{ color: 'var(--green)', fontWeight: 600 }}>{d.d}</td>
                          <td style={{ color: 'var(--amber)', fontWeight: 600 }}>{d.p}</td>
                          <td style={{ color: 'var(--red)', fontWeight: 600 }}>{d.n}</td>
                          <td>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 10, justifyContent:'center' }}>
                              <div className="mb"><div className="mbf" style={{ width: fmPct(d.av), background: pColor(d.av) }}></div></div>
                              <span style={{ fontWeight: 700, color: pColor(d.av), fontSize: 13.5, minWidth: 40 }}>{fmPct(d.av)}</span>
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {pgdStats.length > 0 && (
              <div style={{ marginTop: 28 }}>
                <div className="st">Aporte al Plan Global de Desarrollo (PGD UNAL 2025–2027) <span className="st-sub">avance promedio por eje y programa del PGD</span></div>
                <div className="pgdg">
                  {pgdStats.map((g, i) => (
                    <div key={g.code} className="pgdc" style={{ animationDelay: i * 0.04 + 's' }}>
                      <div className="pgdh">
                        <span className="pgdcode">{g.code}</span>
                        <span className="pgdv" style={{ color: pColor(g.av) }}>{fmPct(g.av)}</span>
                      </div>
                      <div className="pgdm">{g.pc} {g.pc === 1 ? 'proyecto' : 'proyectos'}</div>
                      <div className="pgdb"><div className="pgdbf" style={{ width: fmPct(g.av), background: pColor(g.av) }}></div></div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}

        {/* ════════════════ VISTA POR DEPENDENCIA ════════════════ */}
        {tab !== 'General' && (
          <div>
            <div className="st">{aDep || tab} <span className="st-sub">{filt.length} {filt.length === 1 ? 'proyecto' : 'proyectos'}</span></div>
            {filt.length === 0 && <div className="es">No hay proyectos con los filtros seleccionados.</div>}

            {filt.map((p, pi) => {
              const pAv = getAv(p.id);
              const pCn = getCn(p.id);
              const pActs = acts.filter(x => x.idP === p.id);
              const isOpen = exp[p.id];
              const wWarn = getWeightWarn(p.id);
              const bc = p.est === 'Cerrado' ? 'bg-c' : p.est === 'Cancelado' ? 'bg-x' : pAv >= 0.7 ? 'bg-d' : pAv >= 0.4 ? 'bg-p' : 'bg-n';
              const ejecPct = p.pres > 0 ? p.ejec / p.pres : 0;

              return (
                <div key={p.id} className="pc" style={{ animationDelay: pi * 0.05 + 's' }}>
                  <div className="ph" onClick={() => setExp(prev => ({ ...prev, [p.id]: !prev[p.id] }))}>
                    <div className="pl">
                      <div className={'ch' + (isOpen ? ' op' : '')}>▶</div>
                      <div className="pi">
                        <div className="pid">
                          <span>P{p.id}</span>
                          <span className={'bg ' + bc}>{p.est}</span>
                          {p.pgd && <span className="bg bg-pgd">{p.pgd}</span>}
                        </div>
                        <div className="pnm" title={p.nombre}>{p.nombre}</div>
                        <div className="pmeta">
                          {p.resp && p.resp !== '—' && <span><b>Responsable:</b> {p.resp}</span>}
                          {p.gestor && <span><b>Gestor:</b> {p.gestor}</span>}
                          <span><b>Eje PA:</b> {p.eje}</span>
                          {wWarn && <span className="warn-w" title={'Pesos suman ' + Math.round(wWarn*100) + '%, no 100%'}>⚠ pesos {Math.round(wWarn*100)}%</span>}
                        </div>
                      </div>
                    </div>
                    <div className="pr">
                      <div className="pbudget">
                        <b>{fmCopShort(p.ejec)} / {fmCopShort(p.pres)}</b>
                        <span>presupuesto {p.pres ? Math.round(ejecPct*100) + '%' : ''}</span>
                      </div>
                      <div>
                        <div className="ppct" style={{ color: pColor(pAv) }}>{fmPct(pAv)}</div>
                        <div className="pmt">{pCn.d}/{pCn.t} {pCn.t === 1 ? 'actividad' : 'actividades'}</div>
                      </div>
                    </div>
                  </div>

                  {isOpen && pActs.length > 0 && (
                    <div className="atw">
                      <table className="at">
                        <thead>
                          <tr>
                            <th style={{ width: '3%' }}>#</th>
                            <th style={{ width: '26%' }}>Actividad</th>
                            <th style={{ width: '11%' }}>Peso Wi</th>
                            <th style={{ width: '10%' }}>Subact.</th>
                            <th style={{ width: '9%' }}>Aporte</th>
                            <th style={{ width: '12%' }}>Estado</th>
                            <th style={{ width: '17%' }}>Descripción</th>
                            <th style={{ width: '12%' }}>Observaciones</th>
                          </tr>
                        </thead>
                        <tbody>
                          {pActs.map((a, i) => {
                            const totalW = pActs.reduce((s, x) => s + x.w, 0);
                            const wNorm = totalW > 0 ? a.w / totalW : 0;
                            const ap = wNorm * (Math.min(a.cs, a.ts) / Math.max(a.ts, 1));
                            const est = deriveStatus(a.cs, a.ts, a.est);
                            const eb = est === 'Completada' ? 'bg-d' : est === 'En progreso' ? 'bg-p' : 'bg-n';
                            return (
                              <tr key={a.idA || i}>
                                <td><span className="anm">{i + 1}</span></td>
                                <td>
                                  <div className="aname">{a.nom}</div>
                                  {a.resp && <div style={{fontSize:10.5,color:'var(--text3)',marginTop:1}}>↳ {a.resp}{a.fecha && ' · ' + a.fecha}</div>}
                                </td>
                                <td><div className="pv"><span className="ptx">{fmPct(a.w)}</span><div className="pbr"><div className="pfl" style={{ width: Math.min(100, a.w * 100) + '%' }}></div></div></div></td>
                                <td><span className="spr" style={{ color: a.cs >= a.ts && a.ts > 0 ? 'var(--green)' : 'var(--text)' }}>{a.cs}/{a.ts}</span></td>
                                <td><span className="apv" style={{ color: pColor(a.ts > 0 ? a.cs / a.ts : 0) }}>{fmPct(ap)}</span></td>
                                <td><span className={'bg ' + eb}>{est}</span></td>
                                <td><span className="adsc" title={a.ds}>{a.ds || '—'}</span></td>
                                <td><span className="adsc" title={a.obs} style={{maxWidth:140}}>{a.obs || '—'}</span></td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}
                  {isOpen && pActs.length === 0 && <div className="aem">Sin actividades registradas para este proyecto.</div>}
                </div>
              );
            })}
          </div>
        )}

        <div className="ft">
          <div className="ft1"><span className="ftu">Universidad Nacional de Colombia</span> · Sede Medellín</div>
          <div className="ft2">Facultad de Minas · Plan de Acción 2024–2026 · Dashboard de seguimiento por actividades</div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
